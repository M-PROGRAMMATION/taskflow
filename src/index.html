<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow</title>
  <link rel="icon" href="assets/icones/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Écran de connexion (Cybersécurité, sprint 3) -->
  <section id="ecran-connexion" hidden>
  </section>

  <!-- Écran des tâches (base, sprints 1 et 2) -->
  <main id="ecran-taches" class="conteneur">
    <header class="entete">
      <h1 class="logo">
        <img src="assets/icones/favicon.svg" alt="" width="32" height="32">
        TaskFlow
      </h1>
      <!-- aria-live : le lecteur d'écran annonce le nouveau nombre à chaque changement -->
      <p id="compteur" class="compteur" aria-live="polite"></p>
    </header>

    <!-- Formulaire d'ajout (story 1) -->
    <!-- novalidate : la validation est faite par Taches.valider, avec nos propres messages -->
    <section class="carte" aria-labelledby="titre-ajout">
      <h2 id="titre-ajout">Nouvelle tâche</h2>
      <form id="formulaire-ajout" class="formulaire" novalidate>
        <div class="champ champ-large">
          <label for="ajout-titre">Titre</label>
          <input type="text" id="ajout-titre" maxlength="100" autocomplete="off"
                 placeholder="Ex. Réviser le CSS" aria-describedby="erreur-ajout">
          <p id="erreur-ajout" class="message-erreur" role="alert" hidden></p>
        </div>

        <div class="champ champ-large">
          <label for="ajout-description">Description <span class="facultatif">(facultative)</span></label>
          <input type="text" id="ajout-description" autocomplete="off" placeholder="Ex. Flexbox">
        </div>

        <div class="champ">
          <label for="ajout-priorite">Priorité</label>
          <select id="ajout-priorite">
            <option value="high">Haute</option>
            <option value="medium" selected>Moyenne</option>
            <option value="low">Basse</option>
          </select>
        </div>

        <div class="champ">
          <label for="ajout-echeance">Échéance <span class="facultatif">(facultative)</span></label>
          <input type="date" id="ajout-echeance">
        </div>

        <div class="champ">
          <label for="ajout-categorie">Catégorie <span class="facultatif">(facultative)</span></label>
          <select id="ajout-categorie">
            <option value="" selected>Aucune</option>
            <option value="school">Cours</option>
            <option value="personal">Perso</option>
            <option value="project">Projet</option>
          </select>
        </div>

        <button type="submit" class="bouton bouton-principal">Ajouter</button>
      </form>
    </section>

    <!-- Liste des tâches -->
    <section class="carte" aria-labelledby="titre-liste">
      <h2 id="titre-liste">Mes tâches</h2>

      <!-- Filtre, tri et recherche (sprint 2) : ne changent que l'affichage -->
      <div class="barre-outils">
        <!-- Filtres par statut (story 8) -->
        <div id="filtres" class="filtres" role="group" aria-label="Filtrer par statut">
          <button type="button" class="bouton-filtre" data-filtre="all" aria-pressed="true">Toutes</button>
          <button type="button" class="bouton-filtre" data-filtre="todo" aria-pressed="false">À faire</button>
          <button type="button" class="bouton-filtre" data-filtre="done" aria-pressed="false">Terminées</button>
        </div>

        <!-- Tri (story 9) -->
        <div class="champ champ-tri">
          <label for="tri">Trier par</label>
          <select id="tri">
            <option value="recent" selected>Plus récentes</option>
            <option value="priority">Priorité</option>
            <option value="dueDate">Échéance</option>
          </select>
        </div>
      </div>

      <!-- Texte rempli par Interface.afficherMessageVide -->
      <p id="message-vide" class="message-vide" hidden></p>
      <ul id="liste-taches" class="liste-taches"></ul>
    </section>
  </main>

  <!-- Scripts classiques (pas de type="module"), dans l'ordre des dépendances -->
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
